name: Capture README previews

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-readme-previews.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture live previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/images
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          echo "Using browser: $CHROME"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7000 --screenshot=docs/images/sta-home.png "https://www.stacdqz.tech/"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7000 --screenshot=docs/images/sta-particle-title.png "https://www.stacdqz.tech/design/stellar-preview/"
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --window-size=1440,900 --virtual-time-budget=7000 --screenshot=docs/images/sta-particle-orbit.png "https://www.stacdqz.tech/design/stellar-orbital/"

      - name: Commit previews
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/sta-home.png docs/images/sta-particle-title.png docs/images/sta-particle-orbit.png
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m "Add README preview images"
          git push

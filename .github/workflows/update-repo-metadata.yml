name: Update repository metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-repo-metadata.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update description and topics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description='成都七中科学技术协会（STA）官方网站：组织展示、公告发布、内容管理、访问分析与可视化交互。' \
            -f homepage='https://www.stacdqz.tech'

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -f 'names[]=chengdu-no7' \
            -f 'names[]=science-technology-association' \
            -f 'names[]=student-organization' \
            -f 'names[]=supabase' \
            -f 'names[]=vercel' \
            -f 'names[]=vanilla-javascript' \
            -f 'names[]=gsap' \
            -f 'names[]=content-management'
